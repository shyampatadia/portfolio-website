<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Writing | Shyam Patadia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color: #111827;
        background: #eef8f2;
        font-family: "Inter", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(115deg, #fbfaf4 0%, #eef8f2 46%, #eef7fb 100%),
          linear-gradient(180deg, transparent 0%, rgba(188, 230, 214, 0.32) 100%);
      }

      a {
        color: inherit;
      }

      .page {
        width: min(100%, 940px);
        margin: 0 auto;
        padding: 24px 16px 48px;
      }

      .topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
      }

      .brand-mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 999px;
        background: #020817;
        color: #f8fafc;
        font-family: "Manrope", system-ui, sans-serif;
      }

      .back-link,
      .status-link {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        border: 1px solid rgba(203, 213, 225, 0.9);
        border-radius: 999px;
        background: rgba(255, 252, 246, 0.78);
        padding: 8px 14px;
        color: #334155;
        font-size: 0.92rem;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.045);
      }

      .article {
        overflow: hidden;
        border: 1px solid rgba(203, 213, 225, 0.9);
        border-radius: 18px;
        background:
          radial-gradient(circle at 6% 0%, rgba(255, 237, 213, 0.8), transparent 32%),
          radial-gradient(circle at 96% 8%, rgba(219, 234, 254, 0.72), transparent 30%),
          rgba(255, 252, 246, 0.94);
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.09);
      }

      .article-header {
        display: grid;
        gap: 18px;
        border-bottom: 1px solid rgba(203, 213, 225, 0.85);
        padding: clamp(22px, 5vw, 44px);
      }

      .kicker {
        margin: 0;
        color: #c2410c;
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        max-width: 14ch;
        margin: 0;
        color: #020817;
        font-family: "Manrope", system-ui, sans-serif;
        font-size: clamp(2.15rem, 8vw, 4.7rem);
        font-weight: 800;
        letter-spacing: 0;
        line-height: 0.96;
        text-wrap: balance;
      }

      .excerpt {
        max-width: 68ch;
        margin: 0;
        color: #475569;
        font-size: clamp(1.02rem, 2vw, 1.18rem);
        font-weight: 500;
        line-height: 1.75;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .meta span,
      .tag {
        display: inline-flex;
        align-items: center;
        border: 1px solid rgba(203, 213, 225, 0.88);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.62);
        padding: 7px 12px;
        color: #334155;
        font-size: 0.88rem;
        font-weight: 700;
      }

      .hero-image {
        display: block;
        width: calc(100% - clamp(32px, 8vw, 88px));
        max-height: 420px;
        margin: clamp(18px, 4vw, 32px) auto 0;
        border: 1px solid rgba(203, 213, 225, 0.88);
        border-radius: 18px;
        object-fit: cover;
        box-shadow: 0 18px 42px rgba(15, 23, 42, 0.1);
      }

      .content {
        max-width: 74ch;
        padding: clamp(22px, 5vw, 44px);
        color: #334155;
        font-size: 1.04rem;
        font-weight: 500;
        line-height: 1.85;
      }

      .content > *:first-child {
        margin-top: 0;
      }

      .content > *:last-child {
        margin-bottom: 0;
      }

      .content h2,
      .content h3 {
        margin: 2rem 0 0.65rem;
        color: #020817;
        font-family: "Manrope", system-ui, sans-serif;
        line-height: 1.12;
      }

      .content h2 {
        font-size: clamp(1.55rem, 4vw, 2.25rem);
      }

      .content h3 {
        font-size: clamp(1.25rem, 3vw, 1.6rem);
      }

      .content p {
        margin: 0 0 1.15rem;
      }

      .content ul,
      .content ol {
        padding-left: 1.35rem;
      }

      .content li {
        margin: 0.45rem 0;
      }

      .content blockquote {
        margin: 1.5rem 0;
        border: 1px solid rgba(16, 185, 129, 0.28);
        border-radius: 14px;
        background: rgba(236, 253, 245, 0.55);
        padding: 1rem 1.15rem;
        color: #1e3a34;
      }

      .content pre {
        overflow-x: auto;
        border-radius: 14px;
        background: #0f172a;
        padding: 1rem;
        color: #e2e8f0;
      }

      .content code {
        border-radius: 6px;
        background: rgba(226, 232, 240, 0.7);
        padding: 0.1rem 0.3rem;
        color: #0f172a;
        font-size: 0.92em;
      }

      .content pre code {
        background: transparent;
        padding: 0;
        color: inherit;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        border-top: 1px solid rgba(203, 213, 225, 0.85);
        padding: 0 clamp(22px, 5vw, 44px) clamp(22px, 5vw, 38px);
      }

      .empty,
      .error {
        border: 1px solid rgba(203, 213, 225, 0.9);
        border-radius: 18px;
        background: rgba(255, 252, 246, 0.92);
        padding: 28px;
        box-shadow: 0 18px 42px rgba(15, 23, 42, 0.07);
      }

      .empty h1,
      .error h1 {
        max-width: 18ch;
        font-size: clamp(2rem, 7vw, 3.5rem);
      }

      @media (max-width: 540px) {
        .page {
          padding: 14px 10px 36px;
        }

        .article {
          border-radius: 14px;
        }

        .article-header,
        .content {
          padding: 20px;
        }

        .hero-image {
          width: calc(100% - 40px);
        }

        .tags {
          padding: 0 20px 20px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <nav class="topbar" aria-label="Post navigation">
        <a class="brand" href="/#writing" aria-label="Back to portfolio writing section">
          <span class="brand-mark">SP</span>
          <span>Writing</span>
        </a>
        <a class="back-link" href="/#writing">Back to portfolio</a>
      </nav>

      <section id="post-root" class="empty">
        <p class="kicker">Loading</p>
        <h1>Opening post</h1>
      </section>
    </main>

    <script>
      const PRODUCTION_API = "https://portfolio-website-nine-red-56.vercel.app";

      function isDevelopmentHost() {
        return (
          window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1" ||
          window.location.hostname === ""
        );
      }

      function getApiBaseUrl() {
        return isDevelopmentHost() ? "http://localhost:8000" : PRODUCTION_API;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function inlineMarkdown(value) {
        return escapeHtml(value)
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/\*([^*]+)\*/g, "<em>$1</em>");
      }

      function renderMarkdown(markdown) {
        const lines = String(markdown || "").replace(/\r\n/g, "\n").split("\n");
        const html = [];
        let paragraph = [];
        let listType = null;
        let listItems = [];
        let codeFence = false;
        let codeLines = [];

        function flushParagraph() {
          if (paragraph.length) {
            html.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
            paragraph = [];
          }
        }

        function flushList() {
          if (listType) {
            html.push(`<${listType}>${listItems.join("")}</${listType}>`);
            listType = null;
            listItems = [];
          }
        }

        for (const line of lines) {
          if (line.trim().startsWith("```")) {
            if (codeFence) {
              html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
              codeLines = [];
              codeFence = false;
            } else {
              flushParagraph();
              flushList();
              codeFence = true;
            }
            continue;
          }

          if (codeFence) {
            codeLines.push(line);
            continue;
          }

          const trimmed = line.trim();

          if (!trimmed) {
            flushParagraph();
            flushList();
            continue;
          }

          if (trimmed.startsWith("### ")) {
            flushParagraph();
            flushList();
            html.push(`<h3>${inlineMarkdown(trimmed.slice(4))}</h3>`);
            continue;
          }

          if (trimmed.startsWith("## ")) {
            flushParagraph();
            flushList();
            html.push(`<h2>${inlineMarkdown(trimmed.slice(3))}</h2>`);
            continue;
          }

          if (trimmed.startsWith("> ")) {
            flushParagraph();
            flushList();
            html.push(`<blockquote>${inlineMarkdown(trimmed.slice(2))}</blockquote>`);
            continue;
          }

          const unordered = trimmed.match(/^[-*]\s+(.+)/);
          const ordered = trimmed.match(/^\d+\.\s+(.+)/);

          if (unordered || ordered) {
            flushParagraph();
            const nextType = unordered ? "ul" : "ol";
            if (listType && listType !== nextType) flushList();
            listType = nextType;
            listItems.push(`<li>${inlineMarkdown((unordered || ordered)[1])}</li>`);
            continue;
          }

          paragraph.push(trimmed);
        }

        flushParagraph();
        flushList();

        if (codeFence && codeLines.length) {
          html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
        }

        return html.join("");
      }

      function formatDate(value) {
        if (!value) return "";
        return new Date(value).toLocaleDateString("en-US", {
          year: "numeric",
          month: "short",
          day: "numeric",
        });
      }

      function renderPost(post) {
        document.title = `${post.title} | Shyam Patadia`;
        const root = document.getElementById("post-root");
        const tags = Array.isArray(post.tags) ? post.tags : [];

        root.className = "article";
        root.innerHTML = `
          <header class="article-header">
            <p class="kicker">${escapeHtml(post.category || "Writing")}</p>
            <h1>${escapeHtml(post.title)}</h1>
            ${post.excerpt ? `<p class="excerpt">${escapeHtml(post.excerpt)}</p>` : ""}
            <div class="meta">
              ${post.published_at || post.created_at ? `<span>${formatDate(post.published_at || post.created_at)}</span>` : ""}
              ${post.read_time ? `<span>${escapeHtml(post.read_time)}</span>` : ""}
            </div>
          </header>
          ${post.image_url ? `<img class="hero-image" src="${escapeHtml(post.image_url)}" alt="" loading="lazy" />` : ""}
          <article class="content">${renderMarkdown(post.content)}</article>
          ${
            tags.length
              ? `<div class="tags">${tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>`
              : ""
          }
        `;
      }

      function renderError(message) {
        const root = document.getElementById("post-root");
        root.className = "error";
        root.innerHTML = `
          <p class="kicker">Unavailable</p>
          <h1>Post not found</h1>
          <p class="excerpt">${escapeHtml(message)}</p>
          <a class="status-link" href="/#writing">Back to writing</a>
        `;
      }

      async function loadPost() {
        const slug = new URLSearchParams(window.location.search).get("slug");

        if (!slug) {
          renderError("The post link is missing a slug.");
          return;
        }

        try {
          const response = await fetch(`${getApiBaseUrl()}/api/blog/posts/slug/${encodeURIComponent(slug)}`);
          if (!response.ok) throw new Error(`Request failed with status ${response.status}`);
          renderPost(await response.json());
        } catch (error) {
          renderError(error.message || "Unable to load this post.");
        }
      }

      loadPost();
    </script>
  </body>
</html>
