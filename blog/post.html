<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">Blog Post</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Marked.js for proper markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Highlight.js for syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Config -->
    <script src="../assets/js/app-config.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/analytics.js"></script>

    <style>
      /* ===== MODERN BLOG DESIGN 2025 ===== */

      * {
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #0f0f0f;
        color: #e0e0e0;
        line-height: 1.6;
      }

      /* ===== HEADER ===== */
      .blog-header {
        background: rgba(15, 15, 15, 0.98);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .back-link {
        font-size: 0.9375rem;
        color: #999;
        transition: color 0.2s ease;
        text-decoration: none;
        display: inline-block;
      }

      .back-link:hover {
        color: #fff;
      }

      /* ===== ARTICLE LAYOUT ===== */
      .article-container {
        max-width: 720px;
        margin: 0 auto;
      }

      .article-header {
        margin: 3rem 0 2.5rem;
      }

      .article-title {
        font-size: clamp(2rem, 5vw, 2.5rem);
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.025em;
        color: #ffffff;
        margin: 0 0 1.25rem 0;
      }

      .article-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 1.25rem;
        font-size: 0.9375rem;
        color: #888;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      .meta-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .meta-item i {
        color: #666;
        font-size: 0.875rem;
      }

      /* ===== BLOG CONTENT ===== */
      .blog-content {
        font-size: 1.0625rem; /* 17px - optimal for reading */
        line-height: 1.7;
        color: #d0d0d0;
        margin: 2.5rem 0;
      }

      .blog-content > * {
        margin-bottom: 1.5rem;
      }

      /* Headings */
      .blog-content h1,
      .blog-content h2,
      .blog-content h3,
      .blog-content h4 {
        font-weight: 600;
        color: #ffffff;
        margin-top: 2.5rem;
        margin-bottom: 1rem;
        letter-spacing: -0.01em;
      }

      .blog-content h1 { font-size: 2rem; line-height: 1.25; }
      .blog-content h2 { font-size: 1.625rem; line-height: 1.3; }
      .blog-content h3 { font-size: 1.375rem; line-height: 1.35; }
      .blog-content h4 { font-size: 1.125rem; line-height: 1.4; }

      /* Links */
      .blog-content a {
        color: #60a5fa;
        text-decoration: none;
        border-bottom: 1px solid rgba(96, 165, 250, 0.25);
        transition: all 0.2s ease;
      }

      .blog-content a:hover {
        border-bottom-color: #60a5fa;
        color: #93c5fd;
      }

      /* Text Formatting */
      .blog-content strong {
        font-weight: 600;
        color: #ffffff;
      }

      .blog-content em {
        font-style: italic;
      }

      /* Inline Code */
      .blog-content code {
        font-family: 'SF Mono', 'Monaco', 'Cascadia Code', 'Consolas', monospace;
        font-size: 0.875em;
        background: rgba(255, 255, 255, 0.06);
        color: #fb923c;
        padding: 0.2em 0.4em;
        border-radius: 0.25rem;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      /* Code Blocks - VS Code Style */
      .blog-content pre {
        position: relative;
        background: #282c34 !important; /* Atom One Dark theme */
        border-radius: 0.5rem;
        padding: 0;
        margin: 2rem 0;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      }

      .blog-content pre code {
        display: block;
        padding: 1.25rem 1.5rem;
        overflow-x: auto;
        font-size: 0.875rem;
        line-height: 1.6;
        background: transparent !important;
        border: none;
        color: #abb2bf !important;
        font-family: 'SF Mono', 'Monaco', 'Cascadia Code', 'Consolas', monospace;
      }

      /* Copy Button for Code Blocks */
      .code-block-wrapper {
        position: relative;
        margin: 2rem 0;
      }

      .copy-code-btn {
        position: absolute;
        top: 0.75rem;
        right: 0.75rem;
        background: rgba(255, 255, 255, 0.1);
        color: #aaa;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 0.375rem;
        padding: 0.5rem 0.75rem;
        font-size: 0.75rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        z-index: 10;
        font-family: 'Inter', sans-serif;
        display: flex;
        align-items: center;
        gap: 0.375rem;
      }

      .copy-code-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        border-color: rgba(255, 255, 255, 0.25);
      }

      .copy-code-btn.copied {
        background: rgba(34, 197, 94, 0.2);
        color: #4ade80;
        border-color: rgba(34, 197, 94, 0.3);
      }

      /* Lists */
      .blog-content ul,
      .blog-content ol {
        padding-left: 1.75rem;
        margin-bottom: 1.5rem;
      }

      .blog-content ul {
        list-style-type: disc;
      }

      .blog-content ol {
        list-style-type: decimal;
      }

      .blog-content li {
        margin-bottom: 0.5rem;
        line-height: 1.7;
      }

      .blog-content li::marker {
        color: #60a5fa;
      }

      /* Blockquotes */
      .blog-content blockquote {
        border-left: 3px solid #60a5fa;
        padding-left: 1.5rem;
        margin: 2rem 0;
        color: #a0a0a0;
        font-style: italic;
      }

      /* Images */
      .blog-content img {
        width: 100%;
        height: auto;
        border-radius: 0.5rem;
        margin: 2rem 0;
      }

      .blog-content figure {
        margin: 2rem 0;
      }

      .blog-content figcaption {
        font-size: 0.875rem;
        color: #888;
        text-align: center;
        margin-top: 0.75rem;
        font-style: italic;
      }

      /* ===== REACTIONS - End of Article ===== */
      .reactions-section {
        margin: 3rem 0 2rem;
        padding: 2rem 0;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      .reactions-label {
        font-size: 0.875rem;
        font-weight: 500;
        color: #888;
        text-align: center;
        margin-bottom: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .reactions-grid {
        display: flex;
        justify-content: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      .reaction-btn {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.625rem 1rem;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 2rem;
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 0.875rem;
        color: #999;
        min-width: 48px; /* Touch target */
        justify-content: center;
      }

      .reaction-btn:hover {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.15);
        transform: translateY(-1px);
      }

      .reaction-btn.selected {
        background: rgba(96, 165, 250, 0.12);
        border-color: rgba(96, 165, 250, 0.3);
        color: #60a5fa;
      }

      .reaction-btn .emoji {
        font-size: 1.125rem;
      }

      .reaction-btn .count {
        font-weight: 500;
        min-width: 1.25rem;
        text-align: center;
      }

      /* ===== TAGS ===== */
      .tags-section {
        margin-top: 2rem;
      }

      .tags-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #666;
        margin-bottom: 0.75rem;
      }

      .tags-container {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .tag {
        font-size: 0.8125rem;
        padding: 0.375rem 0.875rem;
        background: rgba(96, 165, 250, 0.08);
        color: #60a5fa;
        border: 1px solid rgba(96, 165, 250, 0.15);
        border-radius: 1.5rem;
        transition: all 0.2s ease;
      }

      .tag:hover {
        background: rgba(96, 165, 250, 0.12);
        border-color: rgba(96, 165, 250, 0.25);
      }

      /* ===== FOOTER ===== */
      .article-footer {
        text-align: center;
        padding: 3rem 0;
        font-size: 0.9375rem;
        color: #888;
      }

      .article-footer a {
        color: #60a5fa;
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .article-footer a:hover {
        color: #93c5fd;
      }

      /* ===== RESPONSIVE DESIGN ===== */
      @media (max-width: 768px) {
        .article-container {
          padding: 0 1.25rem;
        }

        .article-header {
          margin: 2rem 0 1.5rem;
        }

        .article-title {
          font-size: 1.75rem;
        }

        .blog-content {
          font-size: 1rem;
        }

        .blog-content h1 { font-size: 1.625rem; }
        .blog-content h2 { font-size: 1.375rem; }
        .blog-content h3 { font-size: 1.125rem; }

        .blog-content pre code {
          font-size: 0.8125rem;
          padding: 1rem;
        }

        .copy-code-btn {
          font-size: 0.6875rem;
          padding: 0.375rem 0.625rem;
        }

        .reactions-grid {
          gap: 0.5rem;
        }

        .reaction-btn {
          font-size: 0.8125rem;
          padding: 0.5rem 0.75rem;
        }
      }

      /* ===== UTILITY CLASSES ===== */
      .text-center { text-align: center; }
      .mt-4 { margin-top: 1rem; }
      .mb-4 { margin-bottom: 1rem; }
      .py-16 { padding-top: 4rem; padding-bottom: 4rem; }
    </style>
  </head>

  <body x-data="blogPost">
    <!-- Header -->
    <header class="blog-header">
      <div class="article-container" style="padding: 1.25rem 1.5rem;">
        <a href="../index.html#blog" class="back-link">
          ← Back to Blog
        </a>
      </div>
    </header>

    <!-- Main Content -->
    <main class="article-container" style="padding: 0 1.5rem;">
      <!-- Loading State -->
      <div x-show="loading" class="text-center py-16">
        <div style="color: #888;">Loading...</div>
      </div>

      <!-- Error State -->
      <div x-show="error" class="text-center py-16">
        <p style="color: #ef4444;" x-text="error"></p>
        <a href="../index.html#blog" class="mt-4" style="display: inline-block; color: #60a5fa;">
          Return to Blog
        </a>
      </div>

      <!-- Blog Post Content -->
      <article x-show="!loading && !error && post">
        <!-- Header -->
        <header class="article-header">
          <h1 class="article-title" x-text="post?.title"></h1>
          <div class="article-meta">
            <div class="meta-item">
              <i class="far fa-calendar"></i>
              <time x-text="post && formatDate(post.created_at)"></time>
            </div>
            <div class="meta-item" x-show="post?.read_time">
              <i class="far fa-clock"></i>
              <span x-text="post?.read_time"></span>
            </div>
            <div class="meta-item" x-show="post?.category">
              <span x-text="post?.category" style="color: #60a5fa;"></span>
            </div>
          </div>
        </header>

        <!-- Featured Image -->
        <div x-show="post?.image_url">
          <img :src="post?.image_url" :alt="post?.title" style="width: 100%; border-radius: 0.5rem; margin-bottom: 2rem;" />
        </div>

        <!-- Content -->
        <div class="blog-content" x-html="post ? renderMarkdown(post.content) : ''"></div>

        <!-- Reactions Section -->
        <div x-data="reactionSystem()" class="reactions-section">
          <div class="reactions-label">Was this helpful?</div>
          <div class="reactions-grid">
            <button @click="react('gem')" :class="{'selected': selectedReaction === 'gem'}" class="reaction-btn" title="Gem">
              <span class="emoji">💎</span>
              <span class="count" x-text="reactionCounts.gem"></span>
            </button>
            <button @click="react('learned')" :class="{'selected': selectedReaction === 'learned'}" class="reaction-btn" title="Learned something">
              <span class="emoji">💡</span>
              <span class="count" x-text="reactionCounts.learned"></span>
            </button>
            <button @click="react('clarity')" :class="{'selected': selectedReaction === 'clarity'}" class="reaction-btn" title="Needs clarity">
              <span class="emoji">🤔</span>
              <span class="count" x-text="reactionCounts.clarity"></span>
            </button>
            <button @click="react('issues')" :class="{'selected': selectedReaction === 'issues'}" class="reaction-btn" title="Found issues">
              <span class="emoji">🐛</span>
              <span class="count" x-text="reactionCounts.issues"></span>
            </button>
          </div>
        </div>

        <!-- Tags -->
        <div x-show="post?.tags && post.tags.length > 0" class="tags-section">
          <div class="tags-label">Topics</div>
          <div class="tags-container">
            <template x-for="tag in (post?.tags || [])" :key="tag">
              <span class="tag" x-text="tag"></span>
            </template>
          </div>
        </div>
      </article>
    </main>

    <!-- Footer -->
    <footer class="article-footer">
      <a href="../index.html">Return to Portfolio</a>
    </footer>

    <script>
      document.addEventListener('alpine:init', () => {
        Alpine.data('blogPost', () => ({
          post: null,
          loading: true,
          error: null,

          async init() {
            // Get slug from URL query parameter
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');

            if (!slug) {
              this.error = 'No blog post specified';
              this.loading = false;
              return;
            }

            await this.loadPost(slug);
          },

          async loadPost(slug) {
            try {
              this.loading = true;
              this.post = await window.api.getBlogPostBySlug(slug);

              // Update page title
              document.getElementById('page-title').textContent = this.post.title;
              document.title = this.post.title;

              // Track blog post view for analytics
              if (window.analytics && this.post.id) {
                window.analytics.trackBlogView(this.post.id, this.post.slug);
              }

              // Apply syntax highlighting and copy buttons after content renders
              this.$nextTick(() => {
                this.applySyntaxHighlighting();
                this.addCopyButtons();
              });
            } catch (error) {
              console.error('Error loading blog post:', error);
              this.error = 'Failed to load blog post. It may not exist or has been deleted.';
            } finally {
              this.loading = false;
            }
          },

          applySyntaxHighlighting() {
            // Apply highlight.js to all code blocks
            document.querySelectorAll('.blog-content pre code').forEach((block) => {
              if (window.hljs) {
                window.hljs.highlightElement(block);
              }
            });
          },

          addCopyButtons() {
            // Add copy button to each code block
            document.querySelectorAll('.blog-content pre').forEach((pre) => {
              // Skip if button already exists
              if (pre.querySelector('.copy-code-btn')) return;

              const button = document.createElement('button');
              button.className = 'copy-code-btn';
              button.innerHTML = '<i class="far fa-copy"></i> Copy';

              button.addEventListener('click', async () => {
                const code = pre.querySelector('code');
                const text = code.textContent;

                try {
                  await navigator.clipboard.writeText(text);
                  button.innerHTML = '<i class="fas fa-check"></i> Copied!';
                  button.classList.add('copied');

                  setTimeout(() => {
                    button.innerHTML = '<i class="far fa-copy"></i> Copy';
                    button.classList.remove('copied');
                  }, 2000);
                } catch (err) {
                  console.error('Failed to copy:', err);
                }
              });

              pre.appendChild(button);
            });
          },

          formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
              year: 'numeric',
              month: 'long',
              day: 'numeric'
            });
          },

          renderMarkdown(markdown) {
            if (!markdown) return '';

            // Configure marked.js
            const renderer = new marked.Renderer();

            // Custom image renderer - constrain width like Hugo blog
            renderer.image = function(token) {
              // Handle both old and new marked.js API
              const href = typeof token === 'string' ? token : (token.href || '');
              const title = typeof token === 'object' ? token.title : arguments[1];
              const text = typeof token === 'object' ? token.text : arguments[2];

              // Ensure all values are strings
              const hrefStr = String(href || '');
              const titleStr = title && title !== 'undefined' ? String(title) : '';
              const textStr = text ? String(text) : '';

              const titleAttr = titleStr ? `title="${titleStr}"` : '';
              const caption = titleStr ? `<figcaption class="text-center text-sm text-gray-400 mt-2">${titleStr}</figcaption>` : '';

              return `<figure class="my-6">
                <img src="${hrefStr}" alt="${textStr}" ${titleAttr} class="max-w-full mx-auto block rounded-lg" style="max-width: 800px;" />
                ${caption}
              </figure>`;
            };

            // Custom link renderer - open in new tab
            renderer.link = function(token) {
              // Handle both old and new marked.js API
              const href = typeof token === 'string' ? token : (token.href || '');
              const title = typeof token === 'object' ? token.title : arguments[1];
              const text = typeof token === 'object' ? token.text : arguments[2];

              const hrefStr = String(href || '');
              const titleStr = title ? String(title) : '';
              const textStr = text ? String(text) : '';

              return `<a href="${hrefStr}" target="_blank" ${titleStr ? `title="${titleStr}"` : ''}>${textStr}</a>`;
            };

            marked.setOptions({
              renderer: renderer,
              breaks: true,
              gfm: true
            });

            return marked.parse(markdown);
          }
        }));

        // Reaction system component
        Alpine.data('reactionSystem', () => ({
          selectedReaction: null,
          reactionCounts: {
            gem: 0,
            learned: 0,
            clarity: 0,
            issues: 0
          },

          async init() {
            // Load public reaction counts
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');

            if (!slug) return;

            try {
              const apiBase = window.AppConfig?.getApiBaseUrl() || 'http://localhost:8000';
              const response = await fetch(`${apiBase}/api/analytics/blog/${slug}/reactions`);

              if (response.ok) {
                const counts = await response.json();
                this.reactionCounts = counts;
                console.log('[Reactions] Loaded public counts:', counts);
              }
            } catch (error) {
              console.error('[Reactions] Failed to load reaction counts:', error);
            }
          },

          async react(type) {
            const visitorId = window.analytics?.visitorId;
            if (!visitorId) {
              console.error('[Reactions] No visitor ID found');
              return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');

            // Get blog post ID from Alpine blogPost data
            const blogPostData = Alpine.$data(document.querySelector('[x-data="blogPost"]'));
            const blogPostId = blogPostData?.post?.id;

            if (!blogPostId || !slug) {
              console.error('[Reactions] Blog post ID or slug not found');
              return;
            }

            try {
              const apiBase = window.AppConfig?.getApiBaseUrl() || 'http://localhost:8000';
              const response = await fetch(`${apiBase}/api/analytics/react`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  blog_post_id: blogPostId,
                  blog_post_slug: slug,
                  visitor_id: visitorId,
                  reaction_type: type
                })
              });

              if (response.ok) {
                this.selectedReaction = type;
                // Increment local count
                this.reactionCounts[type]++;
                console.log('[Reactions] Reaction submitted:', type);
              }
            } catch (error) {
              console.error('[Reactions] Failed to submit reaction:', error);
            }
          }
        }));
      });
    </script>
  </body>
</html>
